name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: go mod verify
      - run: go mod tidy
      - run: go mod vendor
      - run: git diff --exit-code -- go.mod go.sum vendor

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: go test -mod=vendor ./...

  typescript-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false
      - run: /bin/bash scripts/verify-active-node-toolchain.sh
      - run: /bin/bash scripts/verify-typescript-client.sh

  node-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: /usr/bin/make verify-node-toolchain

  # race is split into shards: internal/cli and internal/resources dominate
  # race time, so they each run as their own job in parallel with the rest.
  race-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: go test -race -mod=vendor ./internal/cli/...

  race-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: go test -race -mod=vendor ./internal/resources/...

  # Everything except the two heavy shards above. Computed dynamically so a new
  # package is covered automatically (no coverage gap).
  race-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: |
          go list -mod=vendor ./... | grep -vE '/internal/(cli|resources)(/|$)' | xargs go test -race -mod=vendor

  verify-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: make fmt-check
      - run: bash scripts/verify-sdk-boundary.sh
      - run: bash scripts/test-verify-sdk-boundary.sh
      - run: make verify-core-boundaries
      - run: make verify-experiment-boundaries
      - run: make verify-machine-contract
      - run: bash scripts/verify-ci-no-live-creds.sh
      - run: bash scripts/test-verify-ci-no-live-creds.sh
      - run: bash scripts/verify-actions-pinned.sh
      - run: bash scripts/test-verify-actions-pinned.sh
      - run: bash scripts/verify-docs.sh
      - run: bash scripts/verify-cli-docs.sh
      - run: bash scripts/test-verify-cli-docs.sh
      - run: make verify-gitleaks-allowlist
      - run: make verify-go-toolchain
      # These verifiers run in `make check` but were absent from PR CI, so a
      # break in release automation, artifacts, the catalog draft, the resource
      # scaffold, the SDK-surface inventory, or the script registry only
      # surfaced locally. Gate them on PRs too.
      - run: make verify-release-automation
      - run: make verify-release-artifacts
      - run: make verify-catalog-draft
      - run: make verify-resource-scaffold
      - run: make verify-sdk-surface-inventory
      - run: make verify-script-registry

  windows-config:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: go test -count=1 -mod=vendor ./internal/dump ./internal/fileperm ./internal/secretref
      # Cobra migration (§9): the windows-config gate must exercise the CLI core,
      # not just fileperm/secretref/keyring. `go build ./...` proves the Windows
      # build (cobra + mousetrap); the internal/cli + internal/redact tests cover
      # the Cobra dispatch and the redacting writer on Windows. The cmd/zscalerctl
      # golden harness stays Linux/macOS-only — its path scrubbing assumes POSIX
      # paths, so running it on Windows would need separate scrub handling.
      - run: go build -mod=vendor ./...
      - run: go test -count=1 -mod=vendor ./internal/cli ./internal/redact
      - run: go test -count=1 -mod=vendor ./internal/keyring -run TestWindowsGetLive -v
        env:
          ZSCALERCTL_KEYRING_LIVE: '1'

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.5'
          cache: true
      - run: go vet -mod=vendor ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - run: staticcheck ./...
      - run: make vuln
      - run: make verify-licenses
      - run: python3 -m pip install --user --require-hashes -r .github/requirements/semgrep.txt
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash scripts/verify-semgrep.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: 8.30.1

  surface-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/verify-surface-changes-manifest.sh
      - run: bash scripts/test-verify-surface-changes-manifest.sh

  # Single stable check for branch protection: succeeds only if every job above
  # succeeded. Lets protection require one check instead of tracking each job.
  required:
    if: ${{ always() }}
    needs:
      - mod-integrity
      - unit
      - typescript-client
      - node-policy
      - race-cli
      - race-resources
      - race-rest
      - verify-gates
      - windows-config
      - static-analysis
      - secret-scan
      - surface-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Require all CI jobs to succeed
        run: /bin/bash scripts/require-ci-jobs.sh "${{ join(needs.*.result, ' ') }}"
